<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tauri App</title>
    <script type="module" src="/main.js" defer></script>
  </head>

  <body>
    <div id="titlebar" data-tauri-drag-region>
      <span style="font-size:10px; opacity:0.7;" data-tauri-drag-region></span>
      <div style="display:flex; gap:4px">
        <button id="minimize" data-tauri-drag-region="false">—</button>
        <button id="close" data-tauri-drag-region="false">✕</button>
      </div>
    </div>
    <div id="content">
      <textarea id="text" rows="1" placeholder="Wpisz pytanie..."></textarea>
      <div id="paste-area" data-tauri-drag-region="false">
        <span>Wklej PrintScreen (Ctrl+V)</span>
        <img id="preview" style="display:none"/>
      </div>
      <button id="send">Wyjaśnij</button>
      <pre id="result">Odpowiedź pojawi się tutaj...</pre>
    </div>
  </body>
</html>
